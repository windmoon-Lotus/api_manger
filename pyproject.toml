[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "authcheck-api-manager"
dynamic = ["version", "dependencies"]
description = "Local API asset, replay and authorization-testing workbench"
readme = "README.md"
requires-python = "==3.9.*"

[tool.setuptools.dynamic]
version = {attr = "apiAnalysis.version.__version__"}
dependencies = {file = ["requirements.in"]}

[tool.setuptools.packages.find]
include = ["apiAnalysis*"]

[tool.unittest]
start-directory = "tests"
