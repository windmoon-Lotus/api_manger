[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "authcheck-cli"
version = "1.1.0"
description = "External HTTP client for the AuthCheck API testing workbench"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
authcheck = "authcheck_cli.cli:main"

[tool.setuptools.packages.find]
include = ["authcheck_cli*"]
